- node_type: embedding
  target_metric: scoring_accuracy
  search_space:
    - module_name: logreg_embedding
      cv: [2]
      embedder_config:
        - model_name: sentence-transformers/all-MiniLM-L6-v2
        - model_name: avsolatorio/GIST-small-Embedding-v0
- node_type: scoring
  target_metric: scoring_roc_auc
  search_space:
    - module_name: knn
      k: [5, 10]
      weights: [uniform, distance, closest]
    - module_name: linear
    - module_name: mlknn
      k: [5]
    - module_name: rerank
      k: [ 5, 10 ]
      weights: [ uniform, distance, closest ]
      use_crosencoder_scores: [true, false]
      m: [ 2, 3 ]
      cross_encoder_config:
        - model_name: cross-encoder/ms-marco-MiniLM-L6-v2
    - module_name: sklearn
      clf_name: [RandomForestClassifier]
      n_estimators: [5, 10]
    - module_name: bert
      classification_model_config:
        - model_name: avsolatorio/GIST-small-Embedding-v0
      num_train_epochs: [1]
      batch_size: [8]
      learning_rate: [5.0e-5]
      seed: [0]
    - module_name: ptuning
      classification_model_config: ["prajjwal1/bert-tiny"]
      num_train_epochs: [1]
      batch_size: [8]
      num_virtual_tokens: [10, 20]
    - module_name: lora
      classification_model_config:
        - model_name: avsolatorio/GIST-small-Embedding-v0
      num_train_epochs: [1]
      batch_size: [8]
      learning_rate: [5.0e-5]
      seed: [0]
      lora_alpha: [16]
- node_type: decision
  target_metric: decision_accuracy
  search_space:
    - module_name: threshold
      thresh: [0.5, [0.5, 0.5, 0.5, 0.5]]
    - module_name: adaptive
    - module_name: tunable
