# tests/conftest.py also runs a session-scoped autouse guard that fails any
# huggingface_hub call whose revision is not a 40-hex SHA, so adding a new
# repo here without also pinning its SHA in DEFAULT_REVISIONS will be
# caught immediately at test time.
