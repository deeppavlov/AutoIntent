search_space:
  - node_type: scoring
    target_metric: scoring_f1
    search_space:
      - module_name: bert
        classification_model_config:
          - model_name: microsoft/deberta-v3-large
        num_train_epochs: [30]
        batch_size: [32, 64, 128]
        learning_rate:
          low: 1.0e-5
          high: 1.0e-4
          log: True
      - module_name: lora
        classification_model_config:
          - model_name: Qwen/Qwen3-Embedding-4B
        target_modules: [[q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]]
        num_train_epochs: [15]
        batch_size: [32, 64, 128]
        learning_rate:
          low: 5.0e-4
          high: 1.0e-3
          log: True
        seed: [0]
        lora_alpha: [32]
        r: [16, 64, 128]
        lora_dropout:
          low: 0.15
          high: 0.25
  - node_type: decision
    target_metric: decision_accuracy
    search_space:
      - module_name: threshold
        thresh:
          low: 0.1
          high: 0.9
      - module_name: argmax
      - module_name: jinoos
      - module_name: tunable
      - module_name: adaptive
hpo_config:
  sampler: tpe
  n_trials: 40
  n_startup_trials: 20