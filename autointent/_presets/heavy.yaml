- node_type: scoring
  target_metric: scoring_roc_auc
  search_space:
    - module_name: knn
      k:
        low: 1
        high: 20
        step: 1
      weights: [uniform, distance, closest]
    - module_name: linear
    - module_name: sklearn
      clf_name:
        - RandomForestClassifier
      n_estimators:
        low: 15
        hight: 200
        step: 30
      max_features: [sqrt, log2, null]
    - module_name: mlknn
      k:
        low: 1
        high: 20
        step: 1
    - module_name: description
      temperature:
        low: 0.01
        high: 10
        log: true
- node_type: decision
  target_metric: decision_accuracy
  search_space:
    - module_name: threshold
      thresh:
        low: 0.1
        high: 0.9
        step: 0.1
    - module_name: argmax
    - module_name: jinoos
    - module_name: tunable
    - module_name: adaptive