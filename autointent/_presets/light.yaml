search_space:
  - node_type: scoring
    target_metric: scoring_roc_auc
    search_space:
      - module_name: knn
        k:
          low: 1
          high: 20
        weights: [uniform, distance, closest]
      - module_name: linear
      - module_name: mlknn
        k:
          low: 1
          high: 20
  - node_type: decision
    target_metric: decision_accuracy
    search_space:
      - module_name: threshold
        thresh:
          low: 0.1
          high: 0.9
      - module_name: argmax
hpo_config:
  sampler: random
  n_trials: 128 # dont know yet if its good
  n_startup_trials: 32