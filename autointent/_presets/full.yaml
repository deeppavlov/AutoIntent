- node_type: scoring
  target_metric: scoring_roc_auc
  search_space:
    - module_name: knn
      k:
        low: 1
        high: 20
        step: 1
      weights: [uniform, distance, closest]
    - module_name: linear
    - module_name: sklearn
      clf_name:
        - RandomForestClassifier
      n_estimators:
        low: 15
        hight: 200
        step: 30
      max_features: [sqrt, log2, null]
    - module_name: rerank
      k:
        low: 5
        high: 20
        step: 1
      weights: [uniform, distance, closest]
      m:
        low: 1
        high: 5
        step: 1
      cross_encoder_config:
        - cross-encoder/ms-marco-MiniLM-L-6-v2
    - module_name: mlknn
      k:
        low: 1
        high: 20
        step: 1
- node_type: decision
  target_metric: decision_accuracy
  search_space:
    - module_name: threshold
      thresh:
        low: 0.1
        high: 0.9
        step: 0.1
    - module_name: argmax
    - module_name: jinoos
    - module_name: tunable
    - module_name: adaptive