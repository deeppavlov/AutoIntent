name: test scorers

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.10", "3.11", "3.12" ]
        dependency-group: [ "base", "transformers", "peft", "catboost" ]
        include:
          - os: windows-latest
            python-version: "3.10"
            dependency-group: "base"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Hugging Face
      id: cache-hf
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-hf

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.8"

    - name: Install dependencies for Python ${{ matrix.python-version }}
      run: |
        uv python pin ${{ matrix.python-version }}
        uv sync --group test ${{ matrix.dependency-group != 'base' && format('--extra {0}', matrix.dependency-group) || '' }}

    - name: Run scorer tests
      run: |
        uv run pytest -n auto tests/modules/scoring/

