name: test scorers

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        dependency-group: [ "base", "transformers", "peft", "catboost" ]
    uses: ./.github/workflows/reusable-test.yaml
    secrets: inherit
    with:
      test_command: pytest -n auto tests/modules/scoring/
      extras: ${{ matrix.dependency-group != 'base' && format('--extra {0}', matrix.dependency-group) || '' }}
      prewarm_models: ${{ (matrix.dependency-group == 'transformers' || matrix.dependency-group == 'peft') && 'prajjwal1/bert-tiny@79779625a0a40f1eee8496e16056bc0d7766df22' || '' }}
