name: Reusable Test Workflow

on:
  workflow_call:
    inputs:
      test_command:
        required: true
        type: string
        description: 'Command to run tests'
      extras:
        required: false
        type: string
        default: ''
        description: 'Space-separated --extra flags (e.g., "--extra transformers --extra peft")'

concurrency:
  group: reusable-test-${{ github.workflow }}-${{ github.ref }}-${{ inputs.extras }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14", ]
        include:
          - os: windows-latest
            python-version: "3.10"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # The HF cache is populated by ci.yaml's warm-cache job, which runs before
    # any reusable-test caller. The first two restore-keys prefer that warmed
    # cache (the hashFiles key matches when .ci/hf-prewarm.yaml hasn't changed
    # between the warm-cache save and this restore). The fallback keys cover
    # branches whose warm-cache hasn't run yet.
    - name: Cache Hugging Face
      id: cache-hf
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-hf-${{ github.run_id }}-${{ matrix.python-version }}
        restore-keys: |
          ${{ runner.os }}-hf-warmed-${{ hashFiles('.ci/hf-prewarm.yaml') }}-
          ${{ runner.os }}-hf-warmed-
          ${{ runner.os }}-hf-${{ github.run_id }}-
          ${{ runner.os }}-hf-

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.10.0"
        enable-cache: "true"

    - name: Install dependencies for Python ${{ matrix.python-version }}
      run: |
        uv python pin ${{ matrix.python-version }}
        uv sync --group test ${{ inputs.extras }}

    - name: Run tests
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        uv run ${{ inputs.test_command }}
