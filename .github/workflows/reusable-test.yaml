name: Reusable Test Workflow

on:
  workflow_call:
    inputs:
      test_command:
        required: true
        type: string
        description: 'Command to run tests'
      extras:
        required: false
        type: string
        default: ''
        description: 'Space-separated --extra flags (e.g., "--extra transformers --extra peft")'
      matrix:
        required: true
        type: string
        description: 'JSON-encoded strategy.matrix payload (os / python-version / include)'
      coverage_artifact:
        required: false
        type: string
        default: ''
        # When non-empty the test run is measured with coverage: the command
        # is appended with `--cov` and the data is written to `.coverage.<value>`,
        # then uploaded as artifact `coverage-data-<value>` for the combine job.
        # Empty (the default for every normal push/PR run) keeps the plain run.
        description: 'Coverage data-file/artifact suffix; empty disables coverage'

# No concurrency block here. The parent workflow (ci.yaml) owns the
# concurrency group for the whole run; if reusable-test sets its own group
# keyed on inputs.extras, ci.yaml jobs that share the same extras
# (test-presets, test-optimization, test-inference all share
# `--extra catboost --extra peft --extra transformers --extra sentence-transformers`)
# collide on the same group and cancel-in-progress kills all but the last
# starter.

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # The HF cache is populated by ci.yaml's warm-cache job, which runs
    # before any reusable-test caller. We use the restore-only action
    # variant (no post-step save) so test jobs never write their own
    # duplicate caches.
    - name: Restore Hugging Face cache
      id: cache-hf
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/huggingface
        # Exact-match the key that the warm-cache job saved this run (same
        # hashFiles inputs → same key). restore-keys is a single prefix
        # fallback so a failed warm-cache run can still reuse the prior
        # week's cache instead of forcing tests to hit HF directly.
        key: ${{ runner.os }}-hf-warmed-${{ hashFiles('.ci/hf-prewarm.yaml', 'src/autointent/configs/_pinned_revisions.py') }}
        restore-keys: |
          ${{ runner.os }}-hf-warmed-

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.10.0"
        enable-cache: "true"

    - name: Install dependencies for Python ${{ matrix.python-version }}
      run: |
        uv python pin ${{ matrix.python-version }}
        uv sync --group test ${{ inputs.extras }}

    - name: Run tests
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # Not offline mode: datasets.load_dataset's HfFileSystem path makes
        # a repo_info API call before consulting the cache, which would
        # raise in offline mode even when the snapshot is on disk. The
        # session-scoped guard in tests/conftest.py turns any unpinned HF
        # call into a deterministic AssertionError, so we don't need
        # offline mode as a backstop.
        HF_HUB_DOWNLOAD_TIMEOUT: "60"
        # Unique per group so the combine job can merge them; only consulted
        # by pytest-cov on the coverage branch below.
        COVERAGE_FILE: .coverage.${{ inputs.coverage_artifact }}
      run: |
        if [ -n "${{ inputs.coverage_artifact }}" ]; then
          uv run ${{ inputs.test_command }} --cov --cov-report=
        else
          uv run ${{ inputs.test_command }}
        fi

    # Hidden-file upload (the data file is `.coverage.*`) is required since
    # actions/upload-artifact excludes dotfiles by default.
    - name: Upload coverage data
      if: inputs.coverage_artifact != ''
      uses: actions/upload-artifact@v7
      with:
        name: coverage-data-${{ inputs.coverage_artifact }}
        path: .coverage.${{ inputs.coverage_artifact }}
        include-hidden-files: true
        if-no-files-found: error
