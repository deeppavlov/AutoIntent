name: Reusable Test Workflow

on:
  workflow_call:
    inputs:
      test_command:
        required: true
        type: string
        description: 'Command to run tests'
      extras:
        required: false
        type: string
        default: ''
        description: 'Space-separated --extra flags (e.g., "--extra transformers --extra peft")'

# No concurrency block here. The parent workflow (ci.yaml) owns the
# concurrency group for the whole run; if reusable-test sets its own group
# keyed on inputs.extras, every ci.yaml job that shares the same extras
# (test-presets, test-optimization, test-inference all share `--extra
# catboost --extra peft --extra transformers --extra sentence-transformers`)
# collides on the same group and cancel-in-progress kills all but the last
# starter — which is exactly the "18 jobs cancelled, same 3 workflows every
# time" pattern observed before this comment was added.

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14", ]
        include:
          - os: windows-latest
            python-version: "3.10"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # The HF cache is populated by ci.yaml's warm-cache job, which runs before
    # any reusable-test caller. We use the restore-only action variant (no
    # post-step save) so test jobs never write their own duplicate caches —
    # historically that filled the 10 GB per-repo budget and evicted the
    # warm-cache write itself. The first restore-key prefers the same-hash
    # warmed cache; the fallbacks cover branches whose warm-cache hasn't run
    # yet or where the prewarm configs were just edited.
    - name: Restore Hugging Face cache
      id: cache-hf
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-hf-warmed-${{ hashFiles('.ci/hf-prewarm-*.yaml') }}-
        restore-keys: |
          ${{ runner.os }}-hf-warmed-${{ hashFiles('.ci/hf-prewarm-*.yaml') }}-
          ${{ runner.os }}-hf-warmed-
          ${{ runner.os }}-hf-

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.10.0"
        enable-cache: "true"

    - name: Install dependencies for Python ${{ matrix.python-version }}
      run: |
        uv python pin ${{ matrix.python-version }}
        uv sync --group test ${{ inputs.extras }}

    - name: Run tests
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # warm_hf_cache.py now populates BOTH caches (hub via snapshot_download
        # + datasets via load_dataset). With every required snapshot and dataset
        # on disk, force offline mode in test jobs so the library can't make
        # any revision-validation API call that would 429 under parallel matrix
        # load. If a test needs an HF resource that isn't in the prewarm list
        # this surfaces as LocalEntryNotFoundError rather than a transient
        # 429 + cryptic OSError.
        HF_HUB_OFFLINE: "1"
        HF_DATASETS_OFFLINE: "1"
        HF_HUB_DOWNLOAD_TIMEOUT: "60"
      run: |
        uv run ${{ inputs.test_command }}
