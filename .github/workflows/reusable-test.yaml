name: Reusable Test Workflow

on:
  workflow_call:
    inputs:
      test_command:
        required: true
        type: string
        description: 'Command to run tests'
      extras:
        required: false
        type: string
        default: ''
        description: 'Space-separated --extra flags (e.g., "--extra transformers --extra peft")'

# No concurrency block here. The parent workflow (ci.yaml) owns the
# concurrency group for the whole run; if reusable-test sets its own group
# keyed on inputs.extras, ci.yaml jobs that share the same extras
# (test-presets, test-optimization, test-inference all share
# `--extra catboost --extra peft --extra transformers --extra sentence-transformers`)
# collide on the same group and cancel-in-progress kills all but the last
# starter.

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14", ]
        include:
          - os: windows-latest
            python-version: "3.10"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # The HF cache is populated by ci.yaml's warm-cache job, which runs
    # before any reusable-test caller. We use the restore-only action
    # variant (no post-step save) so test jobs never write their own
    # duplicate caches.
    - name: Restore Hugging Face cache
      id: cache-hf
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-hf-warmed-${{ hashFiles('.ci/hf-prewarm-*.yaml', 'src/autointent/configs/_pinned_revisions.py') }}-
        restore-keys: |
          ${{ runner.os }}-hf-warmed-${{ hashFiles('.ci/hf-prewarm-*.yaml', 'src/autointent/configs/_pinned_revisions.py') }}-
          ${{ runner.os }}-hf-warmed-
          ${{ runner.os }}-hf-

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.10.0"
        enable-cache: "true"

    - name: Install dependencies for Python ${{ matrix.python-version }}
      run: |
        uv python pin ${{ matrix.python-version }}
        uv sync --group test ${{ inputs.extras }}

    - name: Run tests
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # Not offline mode: datasets.load_dataset's HfFileSystem path makes
        # a repo_info API call before consulting the cache, which would
        # raise in offline mode even when the snapshot is on disk. The
        # session-scoped guard in tests/conftest.py turns any unpinned HF
        # call into a deterministic AssertionError, so we don't need
        # offline mode as a backstop.
        HF_HUB_DOWNLOAD_TIMEOUT: "60"
      run: |
        uv run ${{ inputs.test_command }}
