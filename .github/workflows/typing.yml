name: Typing
on: [ push, pull_request ]
jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.8"

      - name: Install dependencies
        run: |
          uv lock
          uv sync --group typing

      - name: Run mypy
        run: uv run mypy src/autointent
