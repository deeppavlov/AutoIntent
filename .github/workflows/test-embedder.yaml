name: test embedder

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yaml
    secrets: inherit
    with:
      test_command: pytest -n auto tests/embedder/ tests/callback/
      extras: --extra sentence-transformers --extra transformers
      # Pre-warm the two HF models used by the embedder tests so that the
      # `pytest -n auto` xdist workers don't race to download them. On Windows
      # the lack of file locking around the HF cache causes concurrent downloads
      # to leave the snapshot in a partial state (e.g. missing 1_Pooling/config.json).
      prewarm_models: |
        sergeyzh/rubert-tiny-turbo
        intfloat/multilingual-e5-small@614241f622f53c4eeff9890bdc4f31cfecc418b3
