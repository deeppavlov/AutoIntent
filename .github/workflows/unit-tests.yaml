name: unit tests

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yaml
    secrets: inherit
    with:
      test_command: pytest -n auto --ignore=tests/modules/scoring/ --ignore=tests/pipeline --ignore=tests/embedder
      # tests/data/test_oos_handling.py pulls DeepPavlov/clinc150 fresh.
      # Pre-warm it once so concurrent xdist workers don't hammer HF's
      # dataset_info endpoint and trip the 1000-req/5-min rate limit.
      prewarm_models: |
        dataset:DeepPavlov/clinc150@d835118ecd5ffe5488d22e9e58d1c23d18c33229