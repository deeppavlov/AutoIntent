name: CI

on:
  push:
    branches:
      - dev
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-cache:
    name: Warm HF cache
    strategy:
      fail-fast: false
      matrix:
        # Per-OS split retained for cache-key namespacing; the content of
        # both prewarm configs is currently identical (3 small SHA-pinned
        # models, <250 MB total).
        include:
          - os: ubuntu-latest
            config: .ci/hf-prewarm-linux.yaml
          - os: windows-latest
            config: .ci/hf-prewarm-windows.yaml
    runs-on: ${{ matrix.os }}
    # Best-effort: an HF outage here must not cancel every PR. Test jobs
    # `needs: warm-cache` but proceed regardless via continue-on-error.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Hash both the prewarm configs (which list repo IDs to warm)
          # AND _pinned_revisions.py (which holds the SHAs the warm
          # script resolves against). Bumping a pinned SHA must
          # invalidate the cache even when the YAML is unchanged.
          key: ${{ runner.os }}-hf-warmed-${{ hashFiles('.ci/hf-prewarm-*.yaml', 'src/autointent/configs/_pinned_revisions.py') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-hf-warmed-${{ hashFiles('.ci/hf-prewarm-*.yaml', 'src/autointent/configs/_pinned_revisions.py') }}-
            ${{ runner.os }}-hf-warmed-

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"

      - name: Run warm-cache script
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --with 'huggingface_hub[hf_xet]' --with pyyaml --with datasets python .ci/warm_hf_cache.py --config ${{ matrix.config }}

  unit-tests:
    name: unit-tests
    needs: warm-cache
    uses: ./.github/workflows/reusable-test.yaml
    secrets: inherit
    with:
      test_command: pytest -n auto --ignore=tests/modules/scoring/ --ignore=tests/pipeline --ignore=tests/embedder

  test-embedder:
    name: test-embedder
    needs: warm-cache
    uses: ./.github/workflows/reusable-test.yaml
    secrets: inherit
    with:
      test_command: pytest -n auto tests/embedder/ tests/callback/
      extras: --extra sentence-transformers --extra transformers

  test-scorers:
    name: test-scorers
    needs: warm-cache
    strategy:
      fail-fast: false
      matrix:
        dependency-group: [ "base", "transformers", "peft", "catboost" ]
    uses: ./.github/workflows/reusable-test.yaml
    secrets: inherit
    with:
      test_command: pytest -n auto tests/modules/scoring/
      extras: ${{ matrix.dependency-group != 'base' && format('--extra {0}', matrix.dependency-group) || '' }}

  test-presets:
    name: test-presets
    needs: warm-cache
    uses: ./.github/workflows/reusable-test.yaml
    secrets: inherit
    with:
      test_command: pytest -n auto tests/pipeline/test_presets.py
      extras: --extra catboost --extra peft --extra transformers --extra sentence-transformers

  test-optimization:
    name: test-optimization
    needs: warm-cache
    uses: ./.github/workflows/reusable-test.yaml
    secrets: inherit
    with:
      test_command: pytest -n auto tests/pipeline/test_optimization.py
      extras: --extra catboost --extra peft --extra transformers --extra sentence-transformers

  test-inference:
    name: test-inference
    needs: warm-cache
    uses: ./.github/workflows/reusable-test.yaml
    secrets: inherit
    with:
      test_command: pytest -n auto tests/pipeline/test_inference.py
      extras: --extra catboost --extra peft --extra transformers --extra sentence-transformers
