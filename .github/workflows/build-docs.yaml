name: Build and Publish Multi-Version Docs

on:
  push:
    branches:
      - dev
  release:
    types:
      - published
  pull_request:
    branches:
      - dev
    # `labeled` lets adding the `full-ci` label re-trigger the docs build on
    # an open PR; ordinary PR commits skip it (see build-docs.if) to avoid the
    # ~20 min `make test-docs` run on every push.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

permissions:
  contents: write

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    # The docs build (~20 min) is gated behind `full-ci` on PRs: it still runs
    # on every push to dev, on releases, and on manual dispatch, but on a PR it
    # only runs when the `full-ci` label is present. build-docs is not a
    # required check (only ruff/mypy/all-tests are), so skipping it on a regular
    # PR does not block merge; docs breakage is caught on the push to dev.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Cache Hugging Face
        id: cache-hf
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: docs-cache-hf

      - name: Install pandoc
        run: |
          sudo apt install pandoc

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.0"

      - name: Install dependencies
        run: |
          uv sync --group docs --extra catboost --extra peft --extra transformers --extra sentence-transformers --extra openai

      - name: Run tests
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "Testing documentation build..."
          make test-docs

      - name: Build documentation
        if: github.ref == 'refs/heads/dev' && github.event_name != 'workflow_dispatch'
        run: |
          make docs

      - name: build multiversion documentation
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          make multi-version-docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          github_token: ${{ github.token }}
          publish_dir: docs/build/html/versions
          destination_dir: versions
          keep_files: true
